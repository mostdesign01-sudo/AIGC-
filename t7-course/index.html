<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>走进 HTML：一份内容，三种交付 · 得物 T7</title>
<link rel="icon" href="assets/brand/dewu-logo-app.png">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="scroll-track" aria-hidden="true"></div>

<!-- 电影级静帧舞台 -->
<div id="stage" aria-label="T7 课程影像">
  <div id="stills"></div>
  <div id="vignette"></div>
  <div id="grade"></div>
</div>

<!-- 实验室三维层（仅第 5 章） -->
<canvas id="lab-gl" aria-label="互动实验室三维模型"></canvas>

<div id="loader">
  <img src="assets/brand/dewu-logo-app.png" alt="得物" class="loader-logo">
  <div class="loader-title">走进 HTML：一份内容，三种交付</div>
  <div class="loader-sub">上海 · 互联宝地 T7 · 得物</div>
  <div class="loader-bar"><div class="loader-bar-fill" id="loader-fill"></div></div>
  <button id="enter-btn" class="enter-btn" disabled>正在装入影像…</button>
  <div class="loader-hint">滚动推进课程 · ↑↓ / PgUp PgDn 切换章节</div>
</div>

<header id="hud-top" class="hud">
  <div class="hud-brand">
    <img src="assets/brand/dewu-logo-app.png" alt="得物">
    <span class="hud-course">走进 HTML<em>一份内容，三种交付</em></span>
  </div>
  <div class="hud-status">
    <span id="hud-floor">GF · 广场</span>
    <span class="hud-sep"></span>
    <span id="hud-chapter">01 / T7 外景</span>
  </div>
  <div class="hud-actions">
    <button id="btn-audio" class="hud-btn" title="声音开关">声音 关</button>
    <button id="btn-motion" class="hud-btn" title="减少动画">动效 全</button>
    <button id="btn-top" class="hud-btn" title="返回首屏">返回顶部</button>
  </div>
</header>

<nav id="chapter-nav" aria-label="章节进度">
  <div class="nav-line"><div id="nav-line-fill"></div></div>
</nav>

<main id="content"></main>

<div id="lab-panel" class="panel hidden-panel">
  <div class="panel-head">互动实验室 · 拖动旋转 / 滚轮缩放 / 点击切换</div>
  <div class="lab-cases" id="lab-cases"></div>
  <div class="lab-variants" id="lab-variants"></div>
  <div class="panel-tip" id="lab-tip">按住模型拖动即可旋转观察</div>
</div>

<div id="cinema-panel" class="panel hidden-panel">
  <div class="panel-head">HyperFrames · 同一份内容，获得时间</div>
  <div class="cinema-controls">
    <button id="video-play" class="cine-btn">播放</button>
    <button id="video-restart" class="cine-btn">重新播放</button>
    <button id="video-fs" class="cine-btn">全屏</button>
  </div>
  <div class="cinema-progress"><div id="cinema-progress-fill"></div></div>
</div>

<div id="deck-panel" class="panel hidden-panel">
  <div class="panel-head">HTML Presentation · 主屏随滚动翻页</div>
  <canvas id="deck-canvas" width="1440" height="752"></canvas>
</div>

<video id="hf-video" src="assets/video/hyperframes-demo.mp4" playsinline preload="auto" loop></video>

<div id="scroll-cue">滚动 进入 T7<span></span></div>

<script type="importmap">
{ "imports": {
  "three": "./assets/vendor/three.module.js",
  "gltfloader": "./assets/vendor/GLTFLoader.js"
} }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
