<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>得物 11 周年 — 周年 T 恤</title>
  <style>
    :root {
      --bg: #070707;
      --ink: #F3EEE4;
      --ink-dim: rgba(243, 238, 228, 0.22);
      --ink-soft: rgba(243, 238, 228, 0.55);
      --red: #E21A1A;
      --cyan: #00DBDB;
      --card: #101010;
      --rule: rgba(243, 238, 228, 0.08);
      --sans: "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", ui-sans-serif, system-ui, sans-serif;
      --serif: "Songti SC", "STSong", "Noto Serif SC", "Times New Roman", ui-serif, Georgia, serif;
      --pad: clamp(1.5rem, 5vw, 4.5rem);
      --grid: 72px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    ::selection {
      background: var(--red);
      color: var(--ink);
    }

    .grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, var(--rule) 1px, transparent 1px),
        linear-gradient(to bottom, var(--rule) 1px, transparent 1px);
      background-size: var(--grid) var(--grid);
      background-position: 0 0;
    }

    .frame {
      position: relative;
      z-index: 1;
      padding: var(--pad);
      padding-bottom: clamp(4rem, 10vw, 8rem);
    }

    header.top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1rem;
      min-height: 2.5rem;
      margin-bottom: clamp(3rem, 8vh, 6rem);
    }

    header.top .brand,
    header.top .kicker {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 500;
    }

    header.top .brand { justify-self: start; }
    header.top .kicker { justify-self: end; }

    .tick {
      width: 28px;
      height: 1px;
      background: var(--cyan);
      justify-self: center;
    }

    .hero {
      padding-top: clamp(1rem, 4vh, 3rem);
      padding-bottom: clamp(4rem, 12vh, 8rem);
    }

    .meta {
      margin: 0 0 1.1rem;
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ink-soft);
      font-weight: 500;
    }

    .meta .dot {
      display: inline-block;
      width: 16px;
      height: 1px;
      background: var(--cyan);
      vertical-align: middle;
      margin-right: 10px;
    }

    .who {
      margin: 0 0 clamp(3rem, 9vh, 6.5rem);
      font-size: clamp(3.4rem, 12.5vw, 10.5rem);
      font-weight: 800;
      line-height: 0.88;
      letter-spacing: -0.045em;
      max-width: 100%;
      overflow: visible;
    }

    .one {
      display: flex;
      align-items: flex-end;
      gap: clamp(1rem, 3vw, 2.4rem);
      flex-wrap: wrap;
    }

    .eleven {
      margin: 0;
      font-size: clamp(7.2rem, 32vw, 20rem);
      font-weight: 800;
      line-height: 0.76;
      letter-spacing: -0.07em;
      color: var(--red);
      overflow: visible;
    }

    .one-side {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding-bottom: 0.35em;
      min-width: min(12rem, 100%);
    }

    .one-side .meta { margin-bottom: 0.55rem; }

    .zhounian {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(2.4rem, 6.2vw, 5.2rem);
      font-weight: 500;
      line-height: 0.95;
      letter-spacing: 0.08em;
    }

    .glyph {
      display: inline-block;
      will-change: transform;
      transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .remember {
      padding: clamp(2rem, 8vh, 5rem) 0 clamp(3rem, 8vh, 5.5rem);
      max-width: 58rem;
    }

    .line {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(1.7rem, 4.4vw, 3.4rem);
      font-weight: 400;
      line-height: 1.35;
      letter-spacing: 0.08em;
    }

    .line .word {
      display: inline-block;
      margin-right: 0.42em;
      color: var(--ink);
      opacity: 0.18;
      transform: translateY(0.35em);
      transition:
        opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .line.is-in .word { opacity: 1; transform: none; }
    .line.is-in .word:nth-child(1) { transition-delay: 0ms; }
    .line.is-in .word:nth-child(2) { transition-delay: 90ms; }
    .line.is-in .word:nth-child(3) { transition-delay: 180ms; }
    .line.is-in .word:nth-child(4) { transition-delay: 270ms; }

    .evidence {
      padding-top: clamp(1rem, 4vh, 3rem);
    }

    .evidence-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }

    .evidence-head .hint {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .ribbon-stage {
      position: relative;
      height: clamp(420px, 58vh, 560px);
      perspective: 1280px;
      perspective-origin: 50% 46%;
      margin: 0 calc(var(--pad) * -0.25);
    }

    .ribbon {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }

    .card {
      position: absolute;
      width: min(268px, 72vw);
      height: 372px;
      margin-left: calc(min(268px, 72vw) / -2);
      margin-top: -186px;
      padding: 22px 22px 24px;
      background: var(--card);
      border: 1px solid rgba(243, 238, 228, 0.12);
      color: var(--ink);
      transform-style: preserve-3d;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      cursor: default;
    }

    .card-index {
      font-size: 10px;
      letter-spacing: 0.24em;
      color: var(--ink-soft);
    }

    .card-face {
      flex: 1;
      margin: 18px 0 20px;
      position: relative;
      overflow: hidden;
      background: #0b0b0b;
    }

    .card h3 {
      margin: 0 0 6px;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .card p {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
    }

    /* 前胸字 */
    .print {
      position: absolute;
      inset: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.05em;
      font-weight: 800;
      font-size: clamp(1.6rem, 3.4vw, 2.05rem);
      line-height: 0.92;
      letter-spacing: -0.03em;
    }

    .print span:nth-child(odd) { color: var(--ink); }
    .print span:nth-child(even) { color: var(--red); }

    /* 袖标 */
    .badge {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .badge-ring {
      width: 168px;
      height: 168px;
      border-radius: 50%;
      border: 1px dashed rgba(243, 238, 228, 0.35);
      display: grid;
      place-items: center;
      position: relative;
    }

    .badge-ring::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1px solid rgba(243, 238, 228, 0.14);
    }

    .badge-core {
      text-align: center;
    }

    .badge-core strong {
      display: block;
      font-size: 4.4rem;
      font-weight: 800;
      line-height: 0.8;
      letter-spacing: -0.06em;
      color: var(--red);
    }

    .badge-core em {
      display: block;
      margin-top: 0.45rem;
      font-family: var(--serif);
      font-style: normal;
      font-size: 0.95rem;
      letter-spacing: 0.28em;
    }

    /* 吊牌 */
    .tag {
      position: absolute;
      left: 50%;
      top: 18px;
      width: 132px;
      height: 196px;
      transform: translateX(-50%) rotate(-6deg);
      background: var(--ink);
      color: var(--bg);
      padding: 22px 14px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tag-hole {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--bg);
      margin-bottom: 16px;
      position: relative;
    }

    .tag-hole::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 12px;
      width: 1px;
      height: 28px;
      background: var(--cyan);
      transform: translateX(-50%);
    }

    .tag b {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.2em;
    }

    .tag .n {
      margin: 10px 0 12px;
      font-size: 3.1rem;
      font-weight: 800;
      line-height: 0.8;
      letter-spacing: -0.06em;
      color: var(--red);
    }

    .tag i {
      margin-top: auto;
      font-style: normal;
      font-size: 9px;
      letter-spacing: 0.28em;
    }

    footer.foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: clamp(3rem, 8vh, 5rem);
      padding-top: 1.25rem;
      border-top: 1px solid var(--rule);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    @media (max-width: 720px) {
      header.top {
        grid-template-columns: 1fr auto;
      }
      header.top .tick { display: none; }
      .card { height: 340px; margin-top: -170px; }
      .ribbon-stage { height: 400px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .glyph { transition: none; }
      .line .word {
        opacity: 1;
        transform: none;
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>

  <div class="frame">
    <header class="top">
      <span class="brand">POIZON</span>
      <span class="tick" aria-hidden="true"></span>
      <span class="kicker">得物 11 周年</span>
    </header>

    <main>
      <section class="hero" id="hero">
        <p class="meta"><span class="dot"></span>Who</p>
        <h1 class="who" data-kinetic>进场的人</h1>

        <div class="one">
          <h2 class="eleven" data-kinetic>11</h2>
          <div class="one-side">
            <p class="meta"><span class="dot"></span>One</p>
            <p class="zhounian" data-kinetic>周年</p>
          </div>
        </div>
      </section>

      <section class="remember">
        <p class="meta"><span class="dot"></span>Line</p>
        <h2 class="line" id="line">
          <span class="word">CAN'T</span><span class="word">STOP</span><span class="word">WON'T</span><span class="word">STOP</span>
        </h2>
      </section>

      <section class="evidence">
        <div class="evidence-head">
          <p class="meta"><span class="dot"></span>Evid. · 周年 T 恤</p>
          <span class="hint">01 — 03</span>
        </div>

        <div class="ribbon-stage" id="stage">
          <div class="ribbon" id="ribbon">
            <article class="card" data-card>
              <div class="card-index">01</div>
              <div class="card-face" aria-hidden="true">
                <div class="print">
                  <span>CAN'T</span>
                  <span>STOP</span>
                  <span>WON'T</span>
                  <span>STOP</span>
                </div>
              </div>
              <h3>前胸字</h3>
              <p>胸口的句子</p>
            </article>

            <article class="card" data-card>
              <div class="card-index">02</div>
              <div class="card-face" aria-hidden="true">
                <div class="badge">
                  <div class="badge-ring">
                    <div class="badge-core">
                      <strong>11</strong>
                      <em>周年</em>
                    </div>
                  </div>
                </div>
              </div>
              <h3>袖标</h3>
              <p>袖口的十一年</p>
            </article>

            <article class="card" data-card>
              <div class="card-index">03</div>
              <div class="card-face" aria-hidden="true">
                <div class="tag">
                  <span class="tag-hole"></span>
                  <b>得物</b>
                  <span class="n">11</span>
                  <i>POIZON</i>
                </div>
              </div>
              <h3>吊牌</h3>
              <p>领下的证明</p>
            </article>
          </div>
        </div>
      </section>
    </main>

    <footer class="foot">
      <span>周年 T 恤</span>
      <span>得物 11 周年</span>
    </footer>
  </div>

  <script>
    (function () {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function splitKinetic(root) {
        var nodes = root.querySelectorAll("[data-kinetic]");
        for (var i = 0; i < nodes.length; i++) {
          var el = nodes[i];
          var text = el.textContent;
          el.textContent = "";
          el.setAttribute("aria-label", text);
          var chars = Array.from(text);
          for (var j = 0; j < chars.length; j++) {
            var span = document.createElement("span");
            span.className = "glyph";
            span.textContent = chars[j];
            span.setAttribute("aria-hidden", "true");
            el.appendChild(span);
          }
        }
      }

      splitKinetic(document);

      var hero = document.getElementById("hero");
      var glyphs = hero.querySelectorAll(".glyph");

      function resetGlyphs() {
        for (var i = 0; i < glyphs.length; i++) {
          glyphs[i].style.transform = "translate3d(0,0,0)";
        }
      }

      if (!reduce) {
        hero.addEventListener("pointermove", function (e) {
          var cx = e.clientX;
          var cy = e.clientY;
          for (var i = 0; i < glyphs.length; i++) {
            var g = glyphs[i];
            var r = g.getBoundingClientRect();
            var lx = r.left + r.width / 2;
            var ly = r.top + r.height / 2;
            var dx = lx - cx;
            var dy = ly - cy;
            var dist = Math.hypot(dx, dy);
            var t = Math.max(0, 1 - dist / 240);
            var ease = t * t * (3 - 2 * t);
            var push = 26 * ease;
            var ang = Math.atan2(dy, dx);
            g.style.transform =
              "translate3d(" +
              (Math.cos(ang) * push).toFixed(2) +
              "px," +
              (Math.sin(ang) * push).toFixed(2) +
              "px,0)";
          }
        });
        hero.addEventListener("pointerleave", resetGlyphs);
      }

      var line = document.getElementById("line");
      if ("IntersectionObserver" in window) {
        var io = new IntersectionObserver(
          function (entries) {
            for (var i = 0; i < entries.length; i++) {
              if (entries[i].isIntersecting) {
                entries[i].target.classList.add("is-in");
              }
            }
          },
          { threshold: 0.45 }
        );
        io.observe(line);
      } else {
        line.classList.add("is-in");
      }

      var cards = document.querySelectorAll("[data-card]");
      var stage = document.getElementById("stage");
      var paused = false;
      var angle = 0;
      var last = performance.now();

      function radii() {
        var w = window.innerWidth;
        if (w < 720) return { rx: 132, rz: 150 };
        if (w < 1100) return { rx: 280, rz: 190 };
        return { rx: 400, rz: 210 };
      }

      function place(a) {
        var r = radii();
        var n = cards.length;
        for (var i = 0; i < n; i++) {
          var theta = a + (i * Math.PI * 2) / n;
          var x = Math.sin(theta) * r.rx;
          var z = Math.cos(theta) * r.rz;
          var rot = -Math.sin(theta) * 38;
          var depth = (z + r.rz) / (2 * r.rz);
          cards[i].style.transform =
            "translate3d(" +
            x.toFixed(2) +
            "px,0," +
            z.toFixed(2) +
            "px) rotateY(" +
            rot.toFixed(2) +
            "deg)";
          cards[i].style.zIndex = String(Math.round(depth * 100));
          cards[i].style.opacity = (0.42 + depth * 0.58).toFixed(3);
        }
      }

      function tick(now) {
        var dt = Math.min(32, now - last);
        last = now;
        if (!reduce && !paused) angle += dt * 0.00028;
        place(angle);
        requestAnimationFrame(tick);
      }

      if (reduce) {
        place(0.15);
      } else {
        stage.addEventListener("pointerenter", function () { paused = true; });
        stage.addEventListener("pointerleave", function () { paused = false; });
        requestAnimationFrame(tick);
      }
    })();
  </script>
</body>
</html>
