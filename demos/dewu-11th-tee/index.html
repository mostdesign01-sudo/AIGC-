<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>得物 11 周年 — 周年 T 恤 · 物料沟通</title>
  <style>
    :root {
      --bg: #070707;
      --ink: #F3EEE4;
      --ink-soft: rgba(243, 238, 228, 0.55);
      --ink-dim: rgba(243, 238, 228, 0.22);
      --red: #E21A1A;
      --cyan: #00DBDB;
      --card: #101010;
      --panel: #0c0c0c;
      --rule: rgba(243, 238, 228, 0.1);
      --sans: "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", ui-sans-serif, system-ui, sans-serif;
      --serif: "Songti SC", "STSong", "Noto Serif SC", "Times New Roman", ui-serif, Georgia, serif;
      --pad: clamp(1.25rem, 4vw, 3.5rem);
      --grid: 72px;
      --light: 1;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    body { min-height: 100vh; overflow-x: hidden; }

    ::selection { background: var(--red); color: var(--ink); }

    .grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, var(--rule) 1px, transparent 1px),
        linear-gradient(to bottom, var(--rule) 1px, transparent 1px);
      background-size: var(--grid) var(--grid);
    }

    .frame {
      position: relative;
      z-index: 1;
      padding: var(--pad);
      padding-bottom: 4rem;
    }

    header.top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.6rem;
    }

    header.top .brand,
    header.top .kicker,
    header.top .job {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 500;
    }

    header.top .brand { justify-self: start; }
    header.top .job { justify-self: center; color: var(--ink-soft); }
    header.top .kicker { justify-self: end; }

    .tick {
      display: inline-block;
      width: 16px;
      height: 1px;
      background: var(--cyan);
      vertical-align: middle;
      margin-right: 8px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr);
      gap: 1.5rem 2rem;
      align-items: end;
      margin-bottom: 1.75rem;
    }

    .who {
      margin: 0 0 0.15em;
      font-size: clamp(2.1rem, 7vw, 5.4rem);
      font-weight: 800;
      line-height: 0.88;
      letter-spacing: -0.045em;
    }

    .one {
      display: flex;
      align-items: flex-end;
      gap: 0.7rem;
    }

    .eleven {
      margin: 0;
      font-size: clamp(3.4rem, 12vw, 7.2rem);
      font-weight: 800;
      line-height: 0.76;
      letter-spacing: -0.07em;
      color: var(--red);
    }

    .zhounian {
      margin: 0 0 0.18em;
      font-family: var(--serif);
      font-size: clamp(1.4rem, 3.4vw, 2.4rem);
      letter-spacing: 0.12em;
      font-weight: 400;
    }

    .line {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(1.15rem, 2.4vw, 1.85rem);
      font-weight: 400;
      letter-spacing: 0.1em;
      line-height: 1.35;
    }

    .how {
      margin: 0.7rem 0 0;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
    }

    .work {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 1rem;
    }

    .stage {
      background: var(--card);
      border: 1px solid var(--rule);
      min-height: 420px;
      position: relative;
      overflow: hidden;
    }

    .stage-label {
      position: absolute;
      top: 14px;
      left: 16px;
      z-index: 3;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .tee-stage { cursor: grab; touch-action: none; }
    .tee-stage.is-drag { cursor: grabbing; }

    .tee-world {
      position: absolute;
      inset: 36px 12px 28px;
      display: grid;
      place-items: center;
      perspective: 900px;
    }

    .tee-spin {
      transform-style: preserve-3d;
      will-change: transform;
    }

    .tee {
      width: 250px;
      height: 300px;
      position: relative;
      filter: brightness(var(--light)) contrast(calc(0.92 + (var(--light) - 1) * 0.35));
    }

    .knit {
      background-color: #161616;
      background-image:
        repeating-linear-gradient(0deg, rgba(243, 238, 228, 0.07) 0 1px, transparent 1px 3px),
        repeating-linear-gradient(90deg, rgba(243, 238, 228, 0.045) 0 1px, transparent 1px 2px);
    }

    .sleeve {
      position: absolute;
      top: 38px;
      width: 78px;
      height: 92px;
      border-radius: 18px 18px 22px 22px;
    }

    .sleeve.l { left: -2px; transform: rotate(28deg); }
    .sleeve.r { right: -2px; transform: rotate(-28deg); }

    .body {
      position: absolute;
      left: 46px;
      top: 28px;
      width: 158px;
      height: 250px;
      clip-path: polygon(18% 0, 82% 0, 100% 14%, 94% 100%, 6% 100%, 0 14%);
    }

    .collar {
      position: absolute;
      left: 96px;
      top: 22px;
      width: 58px;
      height: 28px;
      border: 7px solid #101010;
      border-bottom: 0;
      border-radius: 50% 50% 0 0;
      z-index: 2;
    }

    .chest {
      position: absolute;
      left: 50%;
      top: 86px;
      transform: translateX(-50%);
      width: 118px;
      text-align: center;
      font-weight: 800;
      font-size: 15px;
      line-height: 0.92;
      letter-spacing: -0.03em;
      cursor: pointer;
    }

    .chest span { display: block; }
    .chest span:nth-child(even) { color: var(--red); }

    .patch {
      position: absolute;
      left: 16px;
      top: 28px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px dashed rgba(243, 238, 228, 0.45);
      display: grid;
      place-items: center;
      color: var(--red);
      font-weight: 800;
      font-size: 13px;
      letter-spacing: -0.06em;
      cursor: pointer;
      background: rgba(7, 7, 7, 0.35);
    }

    .tee[data-patch="off"] .patch {
      color: transparent;
      background: transparent;
    }

    .tee[data-patch="off"] .patch::after {
      content: "";
      width: 18px;
      height: 1px;
      background: rgba(243, 238, 228, 0.25);
    }

    .hang {
      position: absolute;
      left: 132px;
      top: 8px;
      width: 28px;
      height: 44px;
      background: var(--ink);
      color: var(--bg);
      z-index: 3;
      transform: rotate(-8deg);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 3px 4px;
    }

    .hang i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--bg);
      display: block;
    }

    .hang b {
      margin-top: 4px;
      font-size: 7px;
      letter-spacing: 0.04em;
      font-style: normal;
      font-weight: 800;
      color: var(--red);
    }

    .hot {
      outline: none;
    }

    .hot.is-on,
    .chest.is-on,
    .patch.is-on,
    .hang.is-on {
      box-shadow: 0 0 0 1px var(--cyan);
    }

    .inspect-well {
      position: absolute;
      inset: 42px 18px 18px;
    }

    .swatch {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.28s ease;
      overflow: hidden;
    }

    .swatch.is-on { opacity: 1; }

    .swatch-knit {
      position: absolute;
      inset: 0;
      filter: brightness(var(--light));
    }

    .swatch-print {
      position: absolute;
      inset: 18%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-weight: 800;
      font-size: clamp(1.8rem, 3.6vw, 2.6rem);
      line-height: 0.9;
      letter-spacing: -0.04em;
    }

    .swatch-print span { display: block; }
    .swatch-print span:nth-child(even) { color: var(--red); }

    .swatch-badge {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .ring {
      width: min(220px, 56%);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px dashed rgba(243, 238, 228, 0.4);
      display: grid;
      place-items: center;
      position: relative;
    }

    .ring::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 1px solid rgba(243, 238, 228, 0.16);
    }

    .ring strong {
      font-size: 4.2rem;
      font-weight: 800;
      color: var(--red);
      line-height: 0.8;
      letter-spacing: -0.06em;
    }

    .ring em {
      display: block;
      margin-top: 0.4rem;
      font-family: var(--serif);
      font-style: normal;
      letter-spacing: 0.28em;
      text-align: center;
    }

    .ring.is-empty strong,
    .ring.is-empty em { display: none; }

    .ring.is-empty::after {
      content: "未上标";
      letter-spacing: 0.28em;
      font-size: 12px;
      color: var(--ink-soft);
    }

    .swatch-tag {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .paper {
      width: 148px;
      height: 220px;
      background: var(--ink);
      color: var(--bg);
      padding: 26px 16px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: rotate(-4deg);
      filter: brightness(var(--light));
    }

    .paper .hole {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--bg);
      position: relative;
      margin-bottom: 16px;
    }

    .paper .hole::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 14px;
      width: 1px;
      height: 28px;
      background: var(--cyan);
      transform: translateX(-50%);
    }

    .paper b { letter-spacing: 0.22em; font-size: 1.05rem; }
    .paper .n {
      margin: 12px 0 14px;
      font-size: 3.4rem;
      font-weight: 800;
      color: var(--red);
      line-height: 0.8;
    }
    .paper i {
      margin-top: auto;
      font-style: normal;
      font-size: 10px;
      letter-spacing: 0.28em;
    }

    .panel {
      margin-top: 1rem;
      padding: 14px 16px;
      background: var(--panel);
      border: 1px solid var(--rule);
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      gap: 12px 22px;
      align-items: center;
    }

    .panel .now {
      grid-column: 1 / -1;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
    }

    .panel .now b { color: var(--ink); font-weight: 600; }

    .panel label,
    .tog-label {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .panel input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: min(280px, 36vw);
      height: 1px;
      background: rgba(243, 238, 228, 0.28);
      outline: none;
    }

    .panel input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--ink);
      border: 0;
      cursor: pointer;
    }

    .togs { display: flex; gap: 0; }

    .togs button {
      appearance: none;
      background: transparent;
      color: var(--ink-soft);
      border: 1px solid var(--rule);
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.14em;
      padding: 6px 14px;
      cursor: pointer;
    }

    .togs button:first-child { border-right: 0; }
    .togs button.is-on {
      color: var(--ink);
      box-shadow: inset 0 -1px 0 var(--cyan);
    }

    .evidence { margin-top: 1.6rem; }

    .evidence-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.6rem;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .ribbon-stage {
      position: relative;
      height: 340px;
      perspective: 1200px;
    }

    .ribbon {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }

    .card {
      position: absolute;
      width: 220px;
      height: 292px;
      margin-left: -110px;
      margin-top: -146px;
      padding: 16px 16px 18px;
      background: var(--card);
      border: 1px solid rgba(243, 238, 228, 0.12);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      text-align: left;
      color: inherit;
      font: inherit;
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }

    .card.is-on { border-color: rgba(0, 219, 219, 0.55); }

    .card-index {
      font-size: 10px;
      letter-spacing: 0.22em;
      color: var(--ink-soft);
    }

    .card-face {
      flex: 1;
      margin: 12px 0 14px;
      position: relative;
      overflow: hidden;
      background: #0b0b0b;
    }

    .card h3 {
      margin: 0 0 4px;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .card p {
      margin: 0;
      font-size: 12px;
      color: var(--ink-soft);
    }

    .mini-print {
      position: absolute;
      inset: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-weight: 800;
      font-size: 1.15rem;
      line-height: 0.92;
    }

    .mini-print span:nth-child(even) { color: var(--red); }

    .mini-badge {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .mini-badge i {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 1px dashed rgba(243, 238, 228, 0.35);
      display: grid;
      place-items: center;
      color: var(--red);
      font-style: normal;
      font-weight: 800;
      font-size: 1.8rem;
    }

    .mini-tag {
      position: absolute;
      left: 50%;
      top: 18px;
      width: 78px;
      height: 118px;
      transform: translateX(-50%) rotate(-6deg);
      background: var(--ink);
      color: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 8px;
      font-size: 10px;
      letter-spacing: 0.16em;
    }

    .mini-tag b { color: var(--red); font-size: 1.4rem; margin-top: 8px; }

    footer.foot {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--rule);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    @media (max-width: 900px) {
      .hero, .work, .panel { grid-template-columns: 1fr; }
      header.top { grid-template-columns: 1fr 1fr; }
      header.top .job { display: none; }
      .panel input[type="range"] { width: 100%; }
      .ribbon-stage { height: 280px; }
      .card {
        width: 168px;
        height: 230px;
        margin-left: -84px;
        margin-top: -115px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .swatch { transition: none; }
      .tee-spin { transition: none; }
    }
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <div class="frame">
    <header class="top">
      <span class="brand">POIZON</span>
      <span class="job"><span class="tick"></span>物料沟通</span>
      <span class="kicker">得物 11 周年</span>
    </header>

    <section class="hero">
      <div>
        <h1 class="who">进场的人</h1>
        <div class="one">
          <p class="eleven">11</p>
          <p class="zhounian">周年</p>
        </div>
      </div>
      <div>
        <p class="line">CAN'T STOP WON'T STOP</p>
        <p class="how">拖衣服看针织。点卡片切换 前胸字 / 袖标 / 吊牌。这是静态设计怎么被看、被比。</p>
      </div>
    </section>

    <section class="work" aria-label="周年 T 恤">
      <div class="stage tee-stage" id="teeStage">
        <div class="stage-label">周年 T 恤 · 拖动</div>
        <div class="tee-world">
          <div class="tee-spin" id="teeSpin">
            <div class="tee" id="tee" data-patch="on">
              <div class="sleeve l knit">
                <button type="button" class="patch hot" data-part="patch" aria-label="袖标">11</button>
              </div>
              <div class="sleeve r knit"></div>
              <div class="body knit"></div>
              <div class="collar"></div>
              <button type="button" class="chest hot" data-part="print" aria-label="前胸字">
                <span>CAN'T</span><span>STOP</span><span>WON'T</span><span>STOP</span>
              </button>
              <button type="button" class="hang hot" data-part="tag" aria-label="吊牌">
                <i></i><b>11</b>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="stage" id="inspect">
        <div class="stage-label" id="inspectLabel">特写 · 前胸字</div>
        <div class="inspect-well">
          <div class="swatch is-on" data-swatch="print">
            <div class="swatch-knit knit"></div>
            <div class="swatch-print">
              <span>CAN'T</span><span>STOP</span><span>WON'T</span><span>STOP</span>
            </div>
          </div>
          <div class="swatch" data-swatch="patch">
            <div class="swatch-knit knit"></div>
            <div class="swatch-badge">
              <div class="ring" id="patchRing">
                <div>
                  <strong>11</strong>
                  <em>周年</em>
                </div>
              </div>
            </div>
          </div>
          <div class="swatch" data-swatch="tag">
            <div class="swatch-tag">
              <div class="paper">
                <span class="hole"></span>
                <b>得物</b>
                <span class="n">11</span>
                <i>POIZON</i>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <aside class="panel" aria-label="沟通面板">
      <div class="now">正在看 <b id="nowName">前胸字</b> · <span id="nowRead">针织正面 · 印字</span></div>
      <label for="light">亮度</label>
      <input id="light" type="range" min="55" max="140" value="100" />
      <span class="tog-label">袖标</span>
      <div class="togs">
        <button type="button" id="patchOn" class="is-on">开</button>
        <button type="button" id="patchOff">关</button>
      </div>
    </aside>

    <section class="evidence">
      <div class="evidence-head">
        <span><span class="tick"></span>周年 T 恤 · 三处细节</span>
        <span>点选比较</span>
      </div>
      <div class="ribbon-stage" id="stage">
        <div class="ribbon" id="ribbon">
          <button type="button" class="card is-on" data-card data-part="print">
            <div class="card-index">01</div>
            <div class="card-face" aria-hidden="true">
              <div class="mini-print">
                <span>CAN'T</span><span>STOP</span><span>WON'T</span><span>STOP</span>
              </div>
            </div>
            <h3>前胸字</h3>
            <p>胸口的句子</p>
          </button>
          <button type="button" class="card" data-card data-part="patch">
            <div class="card-index">02</div>
            <div class="card-face" aria-hidden="true">
              <div class="mini-badge"><i>11</i></div>
            </div>
            <h3>袖标</h3>
            <p>袖口的十一年</p>
          </button>
          <button type="button" class="card" data-card data-part="tag">
            <div class="card-index">03</div>
            <div class="card-face" aria-hidden="true">
              <div class="mini-tag">得物<b>11</b>POIZON</div>
            </div>
            <h3>吊牌</h3>
            <p>领下的证明</p>
          </button>
        </div>
      </div>
    </section>

    <footer class="foot">
      <span>周年 T 恤</span>
      <span>得物 11 周年</span>
    </footer>
  </div>

  <script>
    (function () {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var parts = {
        print: { name: "前胸字", read: "针织正面 · 印字" },
        patch: { name: "袖标", read: "袖口贴标 · 可开关" },
        tag: { name: "吊牌", read: "纸质吊牌 · 领下" }
      };
      var order = ["print", "patch", "tag"];
      var current = "print";
      var patchOn = true;

      var tee = document.getElementById("tee");
      var teeStage = document.getElementById("teeStage");
      var teeSpin = document.getElementById("teeSpin");
      var nowName = document.getElementById("nowName");
      var nowRead = document.getElementById("nowRead");
      var inspectLabel = document.getElementById("inspectLabel");
      var patchRing = document.getElementById("patchRing");
      var cards = document.querySelectorAll("[data-card]");
      var hots = document.querySelectorAll("[data-part].hot");
      var swatches = document.querySelectorAll("[data-swatch]");

      function setPart(part, fromHover) {
        if (!parts[part]) return;
        current = part;
        nowName.textContent = parts[part].name;
        nowRead.textContent = part === "patch" && !patchOn ? "袖口 · 未上标" : parts[part].read;
        inspectLabel.textContent = "特写 · " + parts[part].name;
        for (var i = 0; i < swatches.length; i++) {
          swatches[i].classList.toggle("is-on", swatches[i].getAttribute("data-swatch") === part);
        }
        for (var j = 0; j < cards.length; j++) {
          cards[j].classList.toggle("is-on", cards[j].getAttribute("data-part") === part);
        }
        for (var k = 0; k < hots.length; k++) {
          hots[k].classList.toggle("is-on", hots[k].getAttribute("data-part") === part);
        }
        if (!fromHover) target = -order.indexOf(part) * ((Math.PI * 2) / 3);
      }

      function setPatch(on) {
        patchOn = on;
        tee.setAttribute("data-patch", on ? "on" : "off");
        patchRing.classList.toggle("is-empty", !on);
        document.getElementById("patchOn").classList.toggle("is-on", on);
        document.getElementById("patchOff").classList.toggle("is-on", !on);
        if (current === "patch") {
          nowRead.textContent = on ? parts.patch.read : "袖口 · 未上标";
        }
      }

      document.getElementById("light").addEventListener("input", function (e) {
        document.documentElement.style.setProperty("--light", String(Number(e.target.value) / 100));
      });
      document.getElementById("patchOn").addEventListener("click", function () { setPatch(true); });
      document.getElementById("patchOff").addEventListener("click", function () { setPatch(false); });

      for (var c = 0; c < cards.length; c++) {
        (function (el) {
          var part = el.getAttribute("data-part");
          el.addEventListener("mouseenter", function () { setPart(part, true); });
          el.addEventListener("focus", function () { setPart(part, true); });
          el.addEventListener("click", function () { setPart(part, false); });
        })(cards[c]);
      }

      for (var h = 0; h < hots.length; h++) {
        hots[h].addEventListener("click", function (e) {
          e.stopPropagation();
          setPart(this.getAttribute("data-part"), false);
        });
      }

      var dragging = false;
      var moved = false;
      var lastX = 0;
      var lastY = 0;
      var ry = -16;
      var rx = 8;
      var vy = ry;
      var vx = rx;

      function onDown(e) {
        dragging = true;
        moved = false;
        teeStage.classList.add("is-drag");
        lastX = e.clientX;
        lastY = e.clientY;
      }

      function onMove(e) {
        if (!dragging) return;
        var dx = e.clientX - lastX;
        var dy = e.clientY - lastY;
        if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
        lastX = e.clientX;
        lastY = e.clientY;
        ry += dx * 0.45;
        rx = Math.max(-24, Math.min(24, rx - dy * 0.28));
      }

      function onUp() {
        dragging = false;
        teeStage.classList.remove("is-drag");
      }

      teeStage.addEventListener("pointerdown", function (e) {
        if (e.target.closest && e.target.closest("button")) return;
        teeStage.setPointerCapture(e.pointerId);
        onDown(e);
      });
      teeStage.addEventListener("pointermove", onMove);
      teeStage.addEventListener("pointerup", onUp);
      teeStage.addEventListener("pointercancel", onUp);

      var angle = 0;
      var target = 0;

      function radii() {
        var w = window.innerWidth;
        if (w < 720) return { rx: 110, rz: 120 };
        if (w < 1100) return { rx: 240, rz: 160 };
        return { rx: 320, rz: 180 };
      }

      function place(a) {
        var r = radii();
        var n = cards.length;
        for (var i = 0; i < n; i++) {
          var theta = a + (i * Math.PI * 2) / n;
          var x = Math.sin(theta) * r.rx;
          var z = Math.cos(theta) * r.rz;
          var rot = -Math.sin(theta) * 32;
          var depth = (z + r.rz) / (2 * r.rz);
          cards[i].style.transform =
            "translate3d(" + x.toFixed(2) + "px,0," + z.toFixed(2) + "px) rotateY(" + rot.toFixed(2) + "deg)";
          cards[i].style.zIndex = String(Math.round(depth * 100));
          cards[i].style.opacity = (0.46 + depth * 0.54).toFixed(3);
        }
      }

      function tick() {
        if (!reduce) {
          vy += (ry - vy) * 0.12;
          vx += (rx - vx) * 0.12;
          angle += (target - angle) * 0.08;
        } else {
          vy = ry;
          vx = rx;
          angle = target;
        }
        teeSpin.style.transform = "rotateY(" + vy.toFixed(2) + "deg) rotateX(" + vx.toFixed(2) + "deg)";
        place(angle);
        requestAnimationFrame(tick);
      }

      setPart("print", false);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
