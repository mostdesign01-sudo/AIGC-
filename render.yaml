services:
  - type: web
    name: aigc-creative
    env: python
    region: oregon
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python run.py
    envVars:
      # pydantic==2.5.0 requires pydantic-core==2.14.1 (wheels only through cp312).
      # A bare runtime.txt of "3.12" is not applied; this service was created
      # 2026-04-20, so Render's default interpreter is 3.14.x and the pip build
      # exits 1 while compiling pydantic-core. Fully qualified; overrides .python-version.
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: QINIU_ACCESS_KEY
        sync: false
      - key: QINIU_SECRET_KEY
        sync: false
      - key: QINIU_BUCKET_NAME
        sync: false
      - key: QINIU_DOMAIN
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: PORT
        sync: false
        value: 10000
