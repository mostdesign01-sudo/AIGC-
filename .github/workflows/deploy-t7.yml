name: Deploy T7 Course to GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/t7-immersive-course-9b59
    paths:
      - 't7-course/**'
      - '.github/workflows/deploy-t7.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: t7-course
      - id: deployment
        uses: actions/deploy-pages@v4
